services:
  gophish:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GOPHISH_VERSION=${GOPHISH_VERSION:-master}
        - TRACKING_PARAM=${TRACKING_PARAM:-cid}
    # TEMP DIAGNOSTIC: capture gophish startup output and keep the container
    # alive after it exits so the crash reason is retrievable via logs.
    entrypoint: ["/bin/sh", "-c", "echo '=== gophish diagnostic start ==='; ./gophish 2>&1; echo \"=== gophish exited with code $$? ===\"; sleep 3600"]
    volumes:
      - gophish-data:/opt/gophish/data
    expose:
      - '3333'
      - '8080'
    depends_on:
      - smtp
    restart: unless-stopped

  smtp:
    image: boky/postfix:latest
    ports:
      - '25:587'
    volumes:
      - smtp-dkim:/etc/opendkim/keys
      - smtp-spool:/var/spool/postfix
    environment:
      - ALLOWED_SENDER_DOMAINS=${SMTP_DOMAINS}
      - HOSTNAME=${SMTP_HOSTNAME}
      - DKIM_AUTOGENERATE=1
      - POSTFIX_myhostname=${SMTP_HOSTNAME}
      - POSTFIX_message_size_limit=20480000
      - POSTFIX_smtp_tls_security_level=may
      - POSTFIX_smtp_tls_note_starttls_offer=yes
    restart: unless-stopped

volumes:
  gophish-data:
  smtp-dkim:
  smtp-spool:
